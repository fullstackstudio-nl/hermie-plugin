# The repo root is the plugin package (Hermes imports the directory), so it has
# an `__init__.py`. pytest would otherwise walk up from `tests/`, find it, and
# try to import the root as a module literally named `__init__`. Rooting the
# run at `tests/` keeps the collection tree below that line:
#
#     python -m pytest --rootdir=tests tests
[pytest]
addopts = --import-mode=importlib
